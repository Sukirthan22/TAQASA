<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arwGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="1180" height="840" fill="#ffffff"/>

  <text x="34" y="42" font-size="21" font-weight="700" fill="#12203a">B2B Receivables Chaser — architecture</text>
  <text x="34" y="66" font-size="13.5" fill="#5a6a85">One invoice, one day at a time. The agent decides, the guardrail permits, the world model rules, the log remembers.</text>

  <!-- legend -->
  <line x1="760" y1="60" x2="786" y2="60" stroke="#4a5568" stroke-width="1.8"/>
  <text x="792" y="64" font-size="10.5" fill="#5a6a85">runtime flow</text>
  <line x1="875" y1="60" x2="901" y2="60" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="907" y="64" font-size="10.5" fill="#5a6a85">evaluation only</text>
  <line x1="1000" y1="60" x2="1026" y2="60" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="1032" y="64" font-size="10.5" fill="#5a6a85">blocked by the rail</text>

  <!-- ================= LANE A : the decision path ================= -->
  <rect x="24" y="92" width="1132" height="192" rx="10" fill="#f5f8fd" stroke="#c9d8ef"/>
  <text x="40" y="118" font-size="11.5" font-weight="700" fill="#2f6fd0" letter-spacing="1.1">THE DECISION PATH — everything here runs on what a collections team could actually know</text>

  <!-- 1 observable features -->
  <rect x="40" y="134" width="176" height="132" rx="8" fill="#ffffff" stroke="#9db6d8" stroke-width="1.4"/>
  <circle cx="58" cy="134" r="11" fill="#2f6fd0"/>
  <text x="58" y="138" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="128" y="162" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Observable features</text>
  <text x="128" y="186" font-size="11" fill="#5a6a85" text-anchor="middle">amount · days overdue</text>
  <text x="128" y="203" font-size="11" fill="#5a6a85" text-anchor="middle">historic DSO · prior disputes</text>
  <text x="128" y="220" font-size="11" fill="#5a6a85" text-anchor="middle">PO mismatch · write-offs</text>
  <text x="128" y="237" font-size="11" fill="#5a6a85" text-anchor="middle">email opened / replied</text>
  <text x="128" y="258" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">harness.redact() → ObservedState</text>

  <!-- 2 cause inference -->
  <rect x="266" y="134" width="176" height="132" rx="8" fill="#ffffff" stroke="#9db6d8" stroke-width="1.4"/>
  <circle cx="284" cy="134" r="11" fill="#2f6fd0"/>
  <text x="284" y="138" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="354" y="162" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Cause inference</text>
  <text x="354" y="186" font-size="11" fill="#5a6a85" text-anchor="middle">rules cascade, 4 branches</text>
  <text x="354" y="203" font-size="11" fill="#5a6a85" text-anchor="middle">73.3% on held-out 150</text>
  <text x="354" y="224" font-size="11" fill="#2f6fd0" text-anchor="middle">FORGOTTEN · CASH_CRUNCH</text>
  <text x="354" y="240" font-size="11" fill="#2f6fd0" text-anchor="middle">DISPUTE · CHRONIC</text>
  <text x="354" y="258" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">src/inference.py</text>

  <!-- 3 action selection -->
  <rect x="492" y="134" width="176" height="132" rx="8" fill="#ffffff" stroke="#9db6d8" stroke-width="1.4"/>
  <circle cx="510" cy="134" r="11" fill="#2f6fd0"/>
  <text x="510" y="138" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="580" y="162" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Action selection</text>
  <text x="580" y="186" font-size="11" fill="#5a6a85" text-anchor="middle">one playbook per cause</text>
  <text x="580" y="206" font-size="10.5" fill="#5a6a85" text-anchor="middle">nudge · wait · offer plan</text>
  <text x="580" y="222" font-size="10.5" fill="#5a6a85" text-anchor="middle">route dispute · escalate</text>
  <text x="580" y="238" font-size="10.5" fill="#5a6a85" text-anchor="middle">write off</text>
  <text x="580" y="258" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">src/policies/agent.py</text>

  <!-- 4 guardrail -->
  <rect x="718" y="134" width="186" height="132" rx="8" fill="#fff6f4" stroke="#e2a79b" stroke-width="1.8"/>
  <circle cx="736" cy="134" r="11" fill="#c0392b"/>
  <text x="736" y="138" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="811" y="162" font-size="13.5" font-weight="700" fill="#8c2f22" text-anchor="middle">Guardrail veto layer</text>
  <text x="811" y="184" font-size="10.5" fill="#8c5a50" text-anchor="middle">C2.1 max 4 contacts</text>
  <text x="811" y="199" font-size="10.5" fill="#8c5a50" text-anchor="middle">C2.2 48h between contacts</text>
  <text x="811" y="214" font-size="10.5" fill="#8c5a50" text-anchor="middle">C2.3 halt on promise-to-pay</text>
  <text x="811" y="229" font-size="10.5" fill="#8c5a50" text-anchor="middle">C2.4 halt on opt-out</text>
  <text x="811" y="244" font-size="10.5" fill="#8c5a50" text-anchor="middle">C2.5 legal bar: &gt;₹2L, &gt;60d</text>
  <text x="811" y="260" font-size="10.5" font-style="italic" fill="#b08a80" text-anchor="middle">src/guardrails.py</text>

  <!-- 5 permitted action -->
  <rect x="954" y="134" width="186" height="132" rx="8" fill="#eef4ff" stroke="#9db6d8" stroke-width="1.4"/>
  <circle cx="972" cy="134" r="11" fill="#2f6fd0"/>
  <text x="972" y="138" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1047" y="162" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Permitted action</text>
  <text x="1047" y="188" font-size="11" fill="#5a6a85" text-anchor="middle">or WAIT, if the guardrail</text>
  <text x="1047" y="204" font-size="11" fill="#5a6a85" text-anchor="middle">refused it</text>
  <text x="1047" y="228" font-size="11" fill="#5a6a85" text-anchor="middle">+ the reason string that</text>
  <text x="1047" y="244" font-size="11" fill="#5a6a85" text-anchor="middle">produced it</text>
  <text x="1047" y="260" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">2,009 refusals on the record</text>

  <!-- lane A arrows -->
  <line x1="216" y1="200" x2="262" y2="200" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="442" y1="200" x2="488" y2="200" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="668" y1="200" x2="714" y2="200" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="904" y1="200" x2="950" y2="200" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ================= THE BENCH : inference arms, off the path ================= -->
  <rect x="24" y="306" width="900" height="158" rx="10" fill="#f7f8fa" stroke="#d0d6e0" stroke-dasharray="7 5"/>
  <text x="40" y="330" font-size="11.5" font-weight="700" fill="#6b7688" letter-spacing="1.1">THE BENCH — four ways to guess the cause, graded on the same held-out 150. Only the first ships.</text>

  <!-- dashed tap from box 2 down to the bench -->
  <line x1="354" y1="266" x2="354" y2="302" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwGrey)"/>
  <text x="364" y="297" font-size="10.5" fill="#8a94a6">same features, same score() — but never inside decide()</text>

  <!-- arm table -->
  <text x="52"  y="356" font-size="10" font-weight="700" fill="#8a94a6" letter-spacing="0.6">ARM</text>
  <text x="336" y="356" font-size="10" font-weight="700" fill="#8a94a6" letter-spacing="0.6" text-anchor="end">ACCURACY</text>
  <text x="440" y="356" font-size="10" font-weight="700" fill="#8a94a6" letter-spacing="0.6" text-anchor="end">CHRONIC prec</text>
  <text x="546" y="356" font-size="10" font-weight="700" fill="#8a94a6" letter-spacing="0.6" text-anchor="end">DISPUTE rec</text>
  <line x1="46" y1="363" x2="552" y2="363" stroke="#dfe4ec" stroke-width="1"/>

  <rect x="44" y="368" width="512" height="20" rx="4" fill="#e8f0fd"/>
  <text x="52"  y="383" font-size="11" font-weight="700" fill="#12203a">rules cascade</text>
  <text x="145" y="383" font-size="9.5" font-weight="700" fill="#2f6fd0">SHIPS</text>
  <text x="336" y="383" font-size="11" font-weight="700" fill="#12203a" text-anchor="end">73.3%</text>
  <text x="440" y="383" font-size="11" font-weight="700" fill="#12203a" text-anchor="end">82%</text>
  <text x="546" y="383" font-size="11" font-weight="700" fill="#12203a" text-anchor="end">70%</text>

  <text x="52"  y="403" font-size="11" fill="#5a6a85">depth-4 decision tree</text>
  <text x="336" y="403" font-size="11" fill="#5a6a85" text-anchor="end">72.0%</text>
  <text x="440" y="403" font-size="11" fill="#5a6a85" text-anchor="end">72%</text>
  <text x="546" y="403" font-size="11" fill="#5a6a85" text-anchor="end">73%</text>

  <text x="52"  y="421" font-size="11" fill="#5a6a85">nemotron-3-ultra <tspan font-weight="700" fill="#12203a">550B</tspan></text>
  <text x="336" y="421" font-size="11" fill="#5a6a85" text-anchor="end">72.0%</text>
  <text x="440" y="421" font-size="11" font-weight="700" fill="#1f5c2f" text-anchor="end">84%</text>
  <text x="546" y="421" font-size="11" fill="#5a6a85" text-anchor="end">67%</text>

  <text x="52"  y="439" font-size="11" fill="#5a6a85">nemotron-3.5-lightning <tspan font-weight="700" fill="#12203a">30B</tspan></text>
  <text x="336" y="439" font-size="11" fill="#5a6a85" text-anchor="end">50.7%</text>
  <text x="440" y="439" font-size="11" fill="#5a6a85" text-anchor="end">80%</text>
  <text x="546" y="439" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">10%</text>

  <text x="52"  y="453" font-size="10" font-style="italic" fill="#a0a9b8">always guess the commonest cause</text>
  <text x="336" y="453" font-size="10" font-style="italic" fill="#a0a9b8" text-anchor="end">35.3%</text>

  <!-- the finding -->
  <rect x="580" y="340" width="330" height="104" rx="8" fill="#ffffff" stroke="#d0d6e0" stroke-width="1.4"/>
  <text x="594" y="360" font-size="11.5" font-weight="700" fill="#12203a">Tested, not assumed</text>
  <text x="594" y="379" font-size="10.5" fill="#5a6a85">The 550B matched the tree and lost to the rules.</text>
  <text x="594" y="394" font-size="10.5" fill="#5a6a85">The 30B found 3 of 30 disputes — it would have</text>
  <text x="594" y="409" font-size="10.5" fill="#5a6a85">forfeited most of the lift.</text>
  <text x="594" y="427" font-size="10.5" fill="#8a99b0">Neither ships: the loop must be deterministic,</text>
  <text x="594" y="440" font-size="10.5" fill="#8a99b0">auditable and free. <tspan font-style="italic">src/llm_arm.py</tspan></text>

  <!-- ================= THE RAIL ================= -->
  <line x1="24" y1="486" x2="1156" y2="486" stroke="#c0392b" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="395" y="470" width="390" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
  <text x="590" y="491" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">THE LEAKAGE RAIL — ground truth never crosses upward</text>

  <!-- ================= LANE B : world only ================= -->
  <rect x="24" y="516" width="1132" height="146" rx="10" fill="#fbf7f2" stroke="#e3d5c2"/>
  <text x="40" y="539" font-size="11.5" font-weight="700" fill="#96703c" letter-spacing="1.1">WHAT ONLY THE WORLD MODEL CAN SEE</text>

  <rect x="40" y="554" width="290" height="92" rx="8" fill="#ffffff" stroke="#d6bd9b" stroke-width="1.4"/>
  <text x="185" y="578" font-size="13.5" font-weight="700" fill="#5c4520" text-anchor="middle">Hidden state</text>
  <text x="185" y="599" font-size="11" fill="#8a6f45" text-anchor="middle">latent_cause · liquidity_day</text>
  <text x="185" y="615" font-size="11" fill="#8a6f45" text-anchor="middle">will they promise · when they opt out</text>
  <text x="185" y="636" font-size="10.5" font-style="italic" fill="#a99172" text-anchor="middle">drawn once at generation, then frozen</text>

  <rect x="370" y="554" width="350" height="92" rx="8" fill="#ffffff" stroke="#d6bd9b" stroke-width="1.8"/>
  <text x="545" y="578" font-size="13.5" font-weight="700" fill="#5c4520" text-anchor="middle">world_model.step(state, action, day)</text>
  <text x="545" y="600" font-size="11" fill="#8a6f45" text-anchor="middle">pure function · rolls no dice</text>
  <text x="545" y="617" font-size="11" fill="#8a6f45" text-anchor="middle">did money arrive? what did it cost?</text>
  <text x="545" y="636" font-size="10.5" font-style="italic" fill="#a99172" text-anchor="middle">same inputs ⇒ same outputs, forever</text>

  <rect x="760" y="554" width="380" height="92" rx="8" fill="#ffffff" stroke="#d6bd9b" stroke-width="1.4"/>
  <text x="950" y="578" font-size="13.5" font-weight="700" fill="#5c4520" text-anchor="middle">Determinism ⇒ the counterfactual</text>
  <text x="950" y="600" font-size="11" fill="#8a6f45" text-anchor="middle">run the baseline over an invoice, rewind,</text>
  <text x="950" y="617" font-size="11" fill="#8a6f45" text-anchor="middle">run the agent over the <tspan font-style="italic">same</tspan> invoice</text>
  <text x="950" y="636" font-size="10.5" font-style="italic" fill="#a99172" text-anchor="middle">real data records only the branch that happened</text>

  <line x1="330" y1="600" x2="366" y2="600" stroke="#96703c" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="720" y1="600" x2="756" y2="600" stroke="#96703c" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- action down into the world -->
  <path d="M 1047 266 L 1047 506 L 545 506 L 545 550" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="1037" y="392" font-size="10.5" fill="#4a5568" text-anchor="end">the action is applied</text>
  <text x="1037" y="406" font-size="10.5" fill="#4a5568" text-anchor="end">to the world</text>

  <!-- blocked upward arrow -->
  <line x1="185" y1="518" x2="185" y2="480" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwRed)"/>
  <text x="196" y="506" font-size="10.5" font-weight="600" fill="#c0392b">blocked</text>

  <!-- ================= OUTPUTS ================= -->
  <rect x="40" y="706" width="340" height="96" rx="8" fill="#ffffff" stroke="#9db6d8" stroke-width="1.4"/>
  <text x="210" y="730" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Append-only audit log</text>
  <text x="210" y="751" font-size="11" fill="#5a6a85" text-anchor="middle">one JSONL row per decision, with a reason</text>
  <text x="210" y="768" font-size="11" fill="#5a6a85" text-anchor="middle">2,944 rows · 2,009 guardrail vetoes</text>
  <text x="210" y="788" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">results/audit_log.jsonl</text>

  <rect x="410" y="706" width="330" height="96" rx="8" fill="#ffffff" stroke="#9db6d8" stroke-width="1.4"/>
  <text x="575" y="730" font-size="13.5" font-weight="700" fill="#12203a" text-anchor="middle">Harness scoreboard</text>
  <text x="575" y="751" font-size="11" fill="#5a6a85" text-anchor="middle">recovered · rate · contacts · cost</text>
  <text x="575" y="768" font-size="11" fill="#5a6a85" text-anchor="middle">net recovery · DSO · per hidden cause</text>
  <text x="575" y="788" font-size="10.5" font-style="italic" fill="#8a99b0" text-anchor="middle">report.md · dashboard.html</text>

  <rect x="770" y="706" width="370" height="96" rx="8" fill="#eaf3ea" stroke="#8fb58f" stroke-width="1.8"/>
  <text x="955" y="732" font-size="13.5" font-weight="700" fill="#1f5c2f" text-anchor="middle">Net incremental recovery</text>
  <text x="955" y="759" font-size="18" font-weight="700" fill="#1f5c2f" text-anchor="middle">₹1,67,68,240  (+33.1%)</text>
  <text x="955" y="782" font-size="11" fill="#3d7a4d" text-anchor="middle">agent net − baseline net, identical 500 invoices</text>
  <text x="955" y="797" font-size="10.5" font-style="italic" fill="#6b9e78" text-anchor="middle">results/report.md</text>

  <line x1="380" y1="754" x2="406" y2="754" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="740" y1="754" x2="766" y2="754" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <path d="M 545 646 L 545 678 L 210 678 L 210 702" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 545 678 L 575 678 L 575 702" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
</svg>
